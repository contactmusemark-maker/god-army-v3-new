<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>God's Army Fitness Centre</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--red:#FF202A;--cyan:#08B8F2;--ink:#080808;--mut:#707784;--bg:#fff;--sf:#F4F5F7;--bd:#E5E7EB;--ok:#0a8f4e;--warn:#c2410c;color-scheme:light}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 0}
main{max-width:720px;margin:0 auto;padding:84px 16px calc(100px + env(safe-area-inset-bottom));display:grid;gap:12px}
main.auth{padding-top:48px;max-width:420px}
.top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;max-width:704px;margin:0 auto;z-index:5;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:8px 12px;box-shadow:0 4px 18px #0001}
.top h1{font-size:17px;margin:0;flex:1}.logo{height:40px;width:40px;object-fit:contain}
.mark{line-height:1;font-weight:900;letter-spacing:.02em;font-size:15px}.mark b{color:var(--red)}.mark small{display:block;font-size:8px;color:var(--cyan);letter-spacing:.12em;margin-top:2px}
.auth .mark{text-align:center;font-size:30px;margin-bottom:12px}.auth .logo{height:120px;width:auto;margin:0 auto;display:block}
.card{background:var(--sf);border-radius:24px;padding:18px;display:grid;gap:10px}.card.dark{background:var(--ink);color:#fff}
.card h2{margin:0;font-size:15px;color:var(--mut);font-weight:600}.dark h2{color:#aaa}.big{font-size:28px;font-weight:800;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{gap:4px}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
input,select{font:inherit;padding:12px;border:1px solid var(--bd);border-radius:14px;background:#fff;color:var(--ink);min-height:48px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn{font:inherit;font-weight:700;min-height:52px;border:0;border-radius:16px;background:var(--red);color:#fff;padding:0 18px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--bd)}.btn.go{background:var(--cyan);color:#001}.btn:disabled{opacity:.5;cursor:wait}
.link{background:none;border:0;color:var(--cyan);font:inherit;min-height:44px;cursor:pointer}
.chip{font:inherit;font-size:13px;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:8px 12px;min-height:40px;cursor:pointer}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#dcfce7;color:var(--ok)}.badge.w{background:#ffedd5;color:var(--warn)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}
.row small{color:var(--mut);display:block}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:4px;background:#fff;border:1px solid var(--bd);border-radius:999px;padding:6px;box-shadow:0 6px 24px #0002;z-index:5;max-width:calc(100% - 16px)}
.nav button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;border-radius:999px;padding:12px 9px;min-height:44px;color:var(--mut);cursor:pointer}.nav .on{background:var(--ink);color:#fff}
.skel{height:120px;border-radius:24px;background:linear-gradient(90deg,var(--sf),#eceef1,var(--sf));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;z-index:9}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--warn)}
.empty{color:var(--mut);text-align:center;padding:12px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal button,.cal i{min-height:40px}.cal button{font:inherit;border:1px solid var(--bd);border-radius:12px;background:#fff;cursor:pointer}.cal .p{background:var(--cyan);color:#001;font-weight:700}.cal .t{outline:2px solid var(--ink)}.stale{color:var(--warn)}.fresh{color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

const $=(s,r=document)=>r.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',4000)};
const brand=()=>CFG.logo?`<img class="logo" src="${esc(CFG.logo)}" alt="God's Army Fitness Centre">`:`<div class="mark"><b>GOD'S</b> ARMY<small>FITNESS CENTRE</small></div>`;
const fD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fT=t=>t?new Date(t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'—';
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
const mins=ts=>{const m=Math.max(0,Math.round((Date.now()-new Date(ts))/6e4));return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`};
const guard=async(btn,fn)=>{if(btn.disabled)return;btn.disabled=true;try{await fn()}catch(e){toast(e.message||'Something went wrong',1)}finally{btn.disabled=false}};

let sb,chan,tick,cur,nchan;
const cleanup=()=>{if(chan){sb.removeChannel(chan);chan=null}clearInterval(tick);if(nchan){sb.removeChannel(nchan);nchan=null}};

if(!CFG.url||!CFG.key){app.innerHTML=`<main class="auth">${brand()}<section class="card"><h2>Setup needed</h2><p>Set <b>CFG.url</b> and <b>CFG.key</b> at the top of the script with your Supabase project URL and publishable key. Then run setup.sql.</p></section></main>`}

async function route(s){

  app.innerHTML='<main><div class="skel"></div><div class="skel"></div></main>';

const shell=(title,body,nav='')=>{app.innerHTML=`<header class="top">${brand()}<h1>${title}</h1><button class="chip" id="so">Sign out</button></header><main>${body}</main>${nav}`;$('#so').onclick=()=>sb.auth.signOut()};

    <p style="margin:0;color:var(--mut)">${inside?`Since ${fT(inside.check_in)} · ${mins(inside.check_in)}`:'Location is verified by the gym server.'}</p>
    <button class="btn ${inside?'':'go'}" id="act">${inside?'Check out':'Check in'}</button></section>
  <div class="grid"><section class="card"><h2>This month</h2><p class="big">${cnt.count??0}</p><small>check-ins</small></section>
  <section class="card"><h2>Latest payment</h2><p class="big">${pay.data?.[0]?inr(pay.data[0].amount):'—'}</p><small>${pay.data?.[0]?esc(pay.data[0].status):'none yet'}</small></section></div>
  <section class="card" id="cal"></section>

  <section class="card"><h2>Recent visits</h2>${hist.data?.length?hist.data.map(a=>`<div class="row"><span>${fD(new Date(a.check_in).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}))}</span><span>${fT(a.check_in)} – ${a.check_out?fT(a.check_out):'in gym'}</span></div>`).join(''):'<div class="empty">No visits yet</div>'}</section>

    const [y,mo]=ym.split('-').map(Number),nx=mo===12?`${y+1}-01`:`${y}-${String(mo+1).padStart(2,'0')}`,days=new Date(y,mo,0).getDate(),lead=new Date(y,mo-1,1).getDay();
    const r=await sb.from('attendance').select('check_in,check_out').gte('check_in',`${ym}-01T00:00:00+05:30`).lt('check_in',`${nx}-01T00:00:00+05:30`);
    if(r.error)return void(el.innerHTML=`<div class="empty">${esc(r.error.message)}</div>`);
    const by={};r.data.forEach(a=>(by[key(a.check_in)]??=[]).push(a));
    el.innerHTML=`<div class="row" style="border:0"><button class="chip" id="pm" aria-label="Previous month">‹</button><b>${new Date(y,mo-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b><button class="chip" id="nm" aria-label="Next month">›</button></div>
    <div class="cal">${'SMTWTFS'.split('').map(d=>`<small>${d}</small>`).join('')}${'<i></i>'.repeat(lead)}${Array.from({length:days},(_,i)=>{const k=`${ym}-${String(i+1).padStart(2,'0')}`;return `<button data-k="${k}" class="${by[k]?'p':''} ${k===today()?'t':''}" aria-label="${k}${by[k]?' attended':''}">${i+1}</button>`}).join('')}</div><div id="cd" class="empty">Tap a day for details. Days without a mark simply have no recorded visit.</div>`;
    $('#pm').onclick=()=>{ym=new Date(y,mo-2,1).toLocaleDateString('en-CA').slice(0,7);draw()};
    $('#nm').onclick=()=>{ym=new Date(y,mo,1).toLocaleDateString('en-CA').slice(0,7);draw()};
    el.querySelectorAll('.cal button').forEach(b=>b.onclick=()=>{const a=by[b.dataset.k];$('#cd').textContent=a?a.map(x=>`${fT(x.check_in)} – ${x.check_out?fT(x.check_out):'still in gym'}`).join(' · '):`${fD(b.dataset.k)}: no attendance recorded`})};

async function pdf(inv,who){
  const {jsPDF}=await import('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/+esm');
  const paid=ok(await sb.from('payments').select('amount').eq('membership_id',inv.membership_id).eq('status','paid')).reduce((s,p)=>s+Number(p.amount),0);
  const d=new jsPDF(),R=n=>'Rs '+Number(n).toFixed(2);let y=22;
  try{d.addImage(CFG.logo,'PNG',14,10,26,26)}catch(e){}d.setFontSize(20);d.setTextColor(255,32,42);d.text("God's Army Fitness Centre",46,y+4);d.setTextColor(0);d.setFontSize(9);const gi=inv.gym_info||{};[gi.address,[gi.phone,gi.email].filter(Boolean).join(' · '),gi.gstin?'GSTIN: '+gi.gstin:''].filter(Boolean).forEach((t,k)=>d.text(String(t),46,y+9+k*4.5));d.setFontSize(10);y+=24;
  d.text(`Invoice ${inv.number}    Issued ${fD(inv.issue_date)}`,14,y);y+=6;d.text(`Member: ${who.full_name} (${who.member_code})`,14,y);y+=12;
  d.line(14,y-6,196,y-6);inv.items.forEach(i=>{d.text(String(i.label),14,y);d.text(R(i.amount),196,y,{align:'right'});y+=7});
  if(Number(inv.tax_amount)>0){d.text(`Includes ${inv.tax_label||'Tax'} @ ${inv.tax_rate}%`,14,y);d.text(R(inv.tax_amount),196,y,{align:'right'});y+=7}
  d.line(14,y-2,196,y-2);y+=6;d.setFont(undefined,'bold');d.text('Total',14,y);d.text(R(inv.total),196,y,{align:'right'});y+=7;d.setFont(undefined,'normal');
  d.text('Paid (confirmed)',14,y);d.text(R(paid),196,y,{align:'right'});y+=7;d.text('Outstanding',14,y);d.text(R(Math.max(0,inv.total-paid)),196,y,{align:'right'});
  d.save(inv.number+'.pdf');
}

async function qrDraw(){try{const u=location.href.split(/[?#]/)[0],m=await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm'),Q=m.default||m;$('#qr').src=await Q.toDataURL(u,{width:440,margin:1});$('#qu').textContent=u}catch(e){$('#qu').textContent='QR could not load: '+e.message}}

const b64u=k=>{const b=atob((k+'='.repeat((4-k.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
const askNotif=async()=>{
  if(!('Notification' in window))return toast('Browser alerts are not supported here',1);
  if(await Notification.requestPermission()!=='granted')return toast('Permission not granted',1);
  try{
    if(!CFG.vapid||!('serviceWorker' in navigator)||!('PushManager' in window))return toast('Alerts on while the app is open');
    const reg=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(CFG.vapid)}),j=sub.toJSON();
    ok(await sb.rpc('save_push_sub',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth}));toast('Alerts on, even when the app is closed');
  }catch(e){toast('Alerts on while the app is open. Push setup failed: '+e.message,1)}
};
function watchNotifs(){

  nchan=sb.channel('notif').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${cur}`},p=>{const n=p.new;toast(n.title+(n.body?': '+n.body:''));if('Notification' in window&&Notification.permission==='granted'){try{new Notification(n.title,{body:n.body||'',icon:CFG.logo})}catch(e){}}}).subscribe();
}
function pricing(f,NJ){
  let fin=f.f.value===''?null:+f.f.value,r=f.r.value;
  if(f.nj.checked){if(f.p.value!=='monthly')throw new Error('New-joiner price applies to the monthly plan only');if(fin!==null)throw new Error('Clear the override or untick new-joiner');fin=NJ+(+f.a.value||0);r='New-joiner first-month price'}
  return{p_final:fin,p_reason:r};
}
const csv=rows=>'\ufeff'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
function dl(name,rows){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv(rows)],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5e3)}
async function pages(q){let all=[],o=0;for(;;){const d=ok(await q().range(o,o+999));all=all.concat(d);if(d.length<1000||all.length>=20000)return all;o+=1000}}

    <form id="rn" class="card"><h2>Add / renew membership</h2><label>Plan<select name="p">${PL.map(p=>`<option value="${p.code}">${p.code} — ${inr(p.price)}</option>`).join('')}</select></label><label>Start date<input type="date" name="s" value="${today()}" required></label><label>Add-on (₹)<input type="number" name="a" min="0" value="0"></label><label>Final price override (₹)<input type="number" name="f" min="0"></label><label>Override reason<input name="r"></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="nj" style="width:24px;min-height:24px"> New-joiner first-month price ${inr(NJ)} (monthly only, replaces base)</label><button class="btn">Save membership</button></form>
    <section class="card"><h2>Memberships</h2>${MS.map(x=>`<div class="row"><span>${esc(x.plan_code)}<small>${fD(x.start_date)} → ${fD(x.end_date)}</small></span><b>${inr(x.final_price)}</b></div>`).join('')||none}</section>
    <section class="card"><h2>Payments</h2>${PP.map(p=>`<div class="row"><span>${inr(p.amount)} · ${esc(p.method)}<small>${fD(p.created_at.slice(0,10))} ${esc(p.reference||'')}</small></span><span class="badge ${p.status==='paid'?'':'w'}">${esc(p.status)}</span></div>`).join('')||none}</section>
    <section class="card"><h2>Invoices</h2>${IV.map(i=>`<div class="row"><span>${esc(i.number||'Draft')}<small>${esc(i.status)}</small></span><b>${inr(i.total)}</b></div>`).join('')||none}</section>
    <section class="card"><h2>Attendance</h2>${AT.map(a=>`<div class="row"><span>${fD(new Date(a.check_in).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}))}<small>${fT(a.check_in)} – ${a.check_out?fT(a.check_out):'open'}</small></span>${a.check_out?'':`<button class="chip fx" data-id="${a.id}">Close session</button>`}</div>`).join('')||none}</section>`;
    $('#bk').onclick=()=>ownerView('members');
    $('#sn').onclick=e=>guard(e.target,async()=>{ok(await sb.from('members').update({notes:$('#nt').value}).eq('id',id).select());toast('Note saved')});
    $('#rn').onsubmit=e=>{e.preventDefault();const f=e.target;guard(f.querySelector('.btn'),async()=>{ok(await sb.rpc('approve_member',{p_member:id,p_plan:f.p.value,p_start:f.s.value,p_addon:+f.a.value||0,...pricing(f,NJ)}));toast('Membership saved');detail(id)})};
    document.querySelectorAll('.fx').forEach(b=>b.onclick=()=>{const r=prompt('Reason for closing this session now (recorded in the audit log):');if(r)guard(b,async()=>{ok(await sb.rpc('correct_attendance',{p_id:b.dataset.id,p_out:new Date().toISOString(),p_reason:r}));detail(id)})});
  }catch(e){v.innerHTML=`<div class="card empty">${esc(e.message)}</div>`}
}

/* ---------- OWNER ---------- */
const TABS=[['live','Live'],['pending','Pending'],['members','Members'],['pay','Pay'],['inv','Invoices'],['gym','Gym']];
async function ownerView(tab){
  cleanup();
  shell('Owner',`<div id="v" style="display:grid;gap:12px"><div class="skel"></div></div>`,`<nav class="nav">${TABS.map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}</nav>`);
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>ownerView(b.dataset.t));
  watchNotifs();
  try{await T[tab]()}catch(e){$('#v').innerHTML=`<div class="card empty">${esc(e.message)}</div>`}
}
const ok=r=>{if(r.error)throw r.error;return r.data};
const T={
async live(){
  const v=$('#v');v.innerHTML=`<div class="grid" id="st"></div><section class="card"><h2>Currently in gym <small id="lu"></small></h2><div id="lst"></div></section>`;
  const load=async()=>{
    const [s,l]=await Promise.all([sb.rpc('owner_stats'),sb.from('attendance').select('check_in,members(full_name,member_code)').is('check_out',null).order('check_in')]);
    if(s.error||l.error)return mark(false);
    const x=s.data,c=[['Inside now',x.inside],['Check-ins today',x.today_in],['Active',x.active],['Expiring ≤7d',x.expiring],['Expired',x.expired],['Pending',x.pending],['Members',x.members],['Collected today',inr(x.collected)],['Outstanding dues',inr(x.dues)]];
    $('#st').innerHTML=c.map(([k,n])=>`<div class="card"><h2>${k}</h2><p class="big">${n}</p></div>`).join('');
    $('#lst').innerHTML=l.data.length?l.data.map(a=>`<div class="row"><span>${esc(a.members?.full_name)}<small>${esc(a.members?.member_code)} · in ${fT(a.check_in)}</small></span><b data-ts="${a.check_in}">${mins(a.check_in)}</b></div>`).join(''):'<div class="empty">Nobody is inside right now</div>';
    mark(true)};
  const mark=live=>{const e=$('#lu');if(e)e.innerHTML=live?`<span class="fresh">● live · updated ${fT(new Date())}</span>`:'<span class="stale">● connection stale — reconnecting</span>'};
  let t;const deb=()=>{clearTimeout(t);t=setTimeout(load,300)};
  await load();
  chan=sb.channel('att-live').on('postgres_changes',{event:'*',schema:'public',table:'attendance'},deb).subscribe(s=>{if(s==='SUBSCRIBED')load();else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(s))mark(false)});
  tick=setInterval(()=>document.querySelectorAll('[data-ts]').forEach(b=>b.textContent=mins(b.dataset.ts)),3e4);
},
async pending(){
  const [mm,pl,gs]=await Promise.all([sb.from('members').select('id,member_code,full_name,phone,dob,created_at,interest_plan,wants_cardio,emergency_name,emergency_phone').eq('status','pending').order('created_at'),sb.from('plans').select('*').order('months'),sb.from('gym_settings').select('addon_price,new_joiner_price').single()]);
  const rows=ok(mm),plans=ok(pl),addon=ok(gs).addon_price,NJ=ok(gs).new_joiner_price;
  $('#v').innerHTML=rows.length?rows.map(m=>`<form class="card" data-id="${m.id}"><h2>${esc(m.member_code)} · ${esc(m.phone)}</h2><p class="big" style="font-size:20px">${esc(m.full_name)}</p><small>Interested: ${esc(m.interest_plan||'—')}${m.wants_cardio?' + Cardio':''}${m.emergency_name?' · Emergency: '+esc(m.emergency_name)+' '+esc(m.emergency_phone||''):''}</small>
  <label>Plan<select name="p">${plans.map(p=>`<option value="${p.code}" ${p.code===m.interest_plan?'selected':''}>${p.code} — ${inr(p.price)} / ${p.months} mo</option>`).join('')}</select></label>
  <label>Start date<input type="date" name="s" value="${today()}" required></label>
  <label>Cardio add-on (₹)<input type="number" name="a" min="0" step="1" value="${m.wants_cardio?addon:0}" placeholder="${addon}"></label>
  <label>Final price override (₹, optional)<input type="number" name="f" min="0" step="1"></label>
  <label>Override reason<input name="r"></label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="nj" style="width:24px;min-height:24px"> New-joiner first-month price ${inr(NJ)} (monthly only, replaces base)</label><button class="btn">Approve &amp; assign</button><button type="button" class="btn ghost rej">Reject</button></form>`).join(''):'<div class="card empty">No pending approvals</div>';
  document.querySelectorAll('form[data-id]').forEach(f=>{
    f.onsubmit=e=>{e.preventDefault();guard(f.querySelector('.btn'),async()=>{ok(await sb.rpc('approve_member',{p_member:f.dataset.id,p_plan:f.p.value,p_start:f.s.value,p_addon:+f.a.value||0,...pricing(f,NJ)}));toast('Member approved');ownerView('pending')})};
    f.querySelector('.rej').onclick=e=>{if(confirm('Reject this member?'))guard(e.target,async()=>{ok(await sb.from('members').update({status:'rejected'}).eq('id',f.dataset.id).select());ownerView('pending')})}});
},
async members(){
  $('#v').innerHTML=`<div class="grid"><label>Search<input id="q" type="search" placeholder="Name, phone or ID"></label><label>Filter<select id="fl"><option value="all">All</option><option value="active">Active</option><option value="expiring">Expiring ≤7 days</option><option value="expired">Expired</option><option value="pending">Pending</option><option value="unpaid">Unpaid / part-paid</option><option value="inside">In gym now</option></select></label></div><section class="card" id="ml"></section><button class="btn ghost" id="more" hidden>Load more</button>`;
  let page=0,q='';const N=20;
  const load=async(reset)=>{
    if(reset){page=0;$('#ml').innerHTML='<h2>Members</h2>'}
    const d=ok(await sb.rpc('member_directory',{p_filter:$('#fl').value,p_q:q.trim(),p_off:page*N,p_lim:N})).map(r=>({...r,memberships:r.end_date?[{plan_code:r.plan_code,end_date:r.end_date}]:[]}));
    if(reset&&!d.length)$('#ml').innerHTML+='<div class="empty">No members found</div>';
    $('#ml').insertAdjacentHTML('beforeend',d.map(m=>{const ms=(m.memberships||[]).sort((a,b)=>b.end_date.localeCompare(a.end_date))[0];
      const lab=m.status!=='active'?m.status:!ms?'no plan':ms.end_date<today()?'expired':'active';
      return `<div class="row" data-id="${m.id}" style="cursor:pointer"><span>${esc(m.full_name)}<small>${esc(m.member_code)} · ${esc(m.phone)}</small></span><span style="text-align:right"><span class="badge ${lab==='active'?'':'w'}">${lab}</span><small>${ms?esc(ms.plan_code)+' · '+fD(ms.end_date):''}${m.due>0?' · due '+inr(m.due):''}</small></span></div>`}).join(''));
    $('#more').hidden=d.length<N;};
  let t;$('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{q=e.target.value;load(true).catch(x=>toast(x.message,1))},300)};
  $('#fl').onchange=()=>load(true).catch(x=>toast(x.message,1));
  $('#ml').onclick=e=>{const r=e.target.closest('[data-id]');if(r)detail(r.dataset.id)};
  $('#more').onclick=()=>{page++;load(false).catch(x=>toast(x.message,1))};
  await load(true);
},
async pay(){
  const [mm,pp]=await Promise.all([sb.from('members').select('id,full_name,member_code').eq('status','active').order('full_name').limit(300),sb.from('payments').select('id,amount,method,reference,status,created_at,members(full_name)').order('created_at',{ascending:false}).limit(15)]);
  const ms=ok(mm),ps=ok(pp);
  $('#v').innerHTML=`<form id="pf" class="card"><h2>Record payment</h2><label>Member<select name="m" required>${ms.map(m=>`<option value="${m.id}">${esc(m.full_name)} (${esc(m.member_code)})</option>`).join('')}</select></label>
  <label>Amount (₹)<input name="a" type="number" min="1" step="0.01" required></label>
  <label>Method<select name="t"><option value="cash">Cash</option><option value="upi">UPI / GPay</option><option value="other">Other</option></select></label>
  <label>UPI / transaction reference<input name="r"></label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="c" style="width:24px;min-height:24px"> I confirm the money has been received</label>
  <button class="btn">Save payment</button></form>
  <section class="card"><h2>Recent payments</h2>${ps.length?ps.map(p=>`<div class="row"><span>${esc(p.members?.full_name)} · ${inr(p.amount)}<small>${esc(p.method)} ${esc(p.reference||'')}</small></span>${p.status==='paid'?'<span class="badge">paid</span>':`<button class="chip cf" data-id="${p.id}">Confirm received</button>`}</div>`).join(''):'<div class="empty">No payments yet</div>'}</section>`;
  $('#pf').onsubmit=e=>{e.preventDefault();const f=e.target;guard(f.querySelector('.btn'),async()=>{ok(await sb.rpc('record_payment',{p_member:f.m.value,p_amount:+f.a.value,p_method:f.t.value,p_ref:f.r.value,p_confirmed:f.c.checked}));toast(f.c.checked?'Payment saved as paid':'Saved as pending');ownerView('pay')})};
  document.querySelectorAll('.cf').forEach(b=>b.onclick=()=>{if(confirm('Confirm money was received?'))guard(b,async()=>{ok(await sb.rpc('confirm_payment',{p_id:b.dataset.id}));ownerView('pay')})});
},
async gym(){
  const g=ok(await sb.from('gym_settings').select('*').single()),PL=ok(await sb.from('plans').select('*').order('months'));
  $('#v').innerHTML=`<form id="gf" class="card"><h2>Geofence</h2><p style="margin:0;color:var(--mut)">Stand inside the gym and tap “Use my location”, or enter coordinates.</p>
  <label>Latitude<input name="la" type="number" step="any" value="${g.lat??''}" required></label><label>Longitude<input name="lo" type="number" step="any" value="${g.lng??''}" required></label>
  <label>Radius (m)<input name="r" type="number" min="20" max="1000" value="${g.radius_m}" required></label><label>Max GPS error allowed (m)<input name="ac" type="number" min="10" max="500" value="${g.max_accuracy_m}" required></label>
  <label>Default Cardio add-on (₹)<input name="ad" type="number" min="0" value="${g.addon_price}" required></label>
  <button type="button" class="btn ghost" id="me">Use my location</button><button class="btn">Save</button></form>
  <form id="iv" class="card"><h2>Sign-up &amp; invoice settings</h2><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="er" ${g.emergency_required?'checked':''} style="width:24px;min-height:24px"> Require emergency contact at sign-up</label>
  <label>Gym phone<input name="gp" value="${esc(g.gym_phone||'')}"></label><label>Gym email<input name="ge" type="email" value="${esc(g.gym_email||'')}"></label><label>Gym address<input name="ga" value="${esc(g.gym_address||'')}"></label><label>GSTIN (optional)<input name="gg" value="${esc(g.gstin||'')}"></label>
  <label>Tax name<input name="tl" value="${esc(g.tax_label||'GST')}"></label><label>Tax % already included in prices (0 = none)<input name="tr" type="number" min="0" max="100" step="0.01" value="${g.tax_rate??0}"></label>
  <label>Gym rules &amp; privacy notice (shown at sign-up)<textarea name="ru" rows="5" style="font:inherit;padding:12px;border:1px solid var(--bd);border-radius:14px;width:100%">${esc(g.rules_text||'')}</textarea></label><button class="btn">Save</button></form>
  <form id="pr" class="card"><h2>Plan prices (₹)</h2>${PL.map(p=>`<label>${esc(p.code)} (${p.months} mo)<input name="${esc(p.code)}" type="number" min="0" step="1" value="${p.price}" required></label>`).join('')}<label>New-joiner first-month price<input name="nj" type="number" min="0" step="1" value="${g.new_joiner_price??1000}" required></label><small>Changes apply to new memberships only; existing ones keep the price they were saved with.</small><button class="btn">Save prices</button><button type="button" class="chip" id="pn">Enable browser alerts</button></form>
  <section class="card"><h2>Member sign-up QR</h2><img id="qr" alt="Sign-up QR code" width="220" height="220" style="margin:auto"><small id="qu"></small><small>Opens the sign-in page. It does not prove anyone is at the gym.</small></section>`;
  qrDraw();auditDraw();reportsDraw();
  $('#iv').onsubmit=e=>{e.preventDefault();const f=e.target;guard(f.querySelector('.btn'),async()=>{ok(await sb.from('gym_settings').update({emergency_required:f.er.checked,gym_phone:f.gp.value||null,gym_email:f.ge.value||null,gym_address:f.ga.value||null,gstin:f.gg.value||null,tax_label:f.tl.value||'GST',tax_rate:+f.tr.value||0,rules_text:f.ru.value||null}).eq('id',1).select());toast('Saved')})};
  $('#pn').onclick=askNotif;
  $('#pr').onsubmit=e=>{e.preventDefault();const f=e.target;guard(f.querySelector('.btn'),async()=>{for(const p of PL)ok(await sb.from('plans').update({price:+f[p.code].value}).eq('code',p.code).select());ok(await sb.from('gym_settings').update({new_joiner_price:+f.nj.value}).eq('id',1).select());toast('Prices saved')})};
  $('#me').onclick=e=>guard(e.target,async()=>{const p=await pos().catch(()=>{throw new Error('Could not read location')});$('[name=la]').value=p.coords.latitude;$('[name=lo]').value=p.coords.longitude;toast(`Filled (±${Math.round(p.coords.accuracy)} m)`)});
  $('#gf').onsubmit=e=>{e.preventDefault();const f=e.target;guard(f.querySelector('.btn:last-child'),async()=>{ok(await sb.from('gym_settings').update({lat:+f.la.value,lng:+f.lo.value,radius_m:+f.r.value,max_accuracy_m:+f.ac.value,addon_price:+f.ad.value,updated_at:new Date().toISOString()}).eq('id',1).select());toast('Saved')})};
},
async inv(){
  const [a,b]=await Promise.all([
    sb.from('memberships').select('id,plan_code,start_date,final_price,members(full_name)').order('created_at',{ascending:false}).limit(100),
    sb.from('invoices').select('id,number,status,total,issue_date,items,membership_id,tax_rate,tax_amount,tax_label,gym_info,members(full_name,member_code)').order('created_at',{ascending:false}).limit(20)]);
  const ms=ok(a),iv=ok(b);
  $('#v').innerHTML=`<form id="nf" class="card"><h2>New draft invoice</h2><label>Membership<select name="m" required>${ms.map(m=>`<option value="${m.id}">${esc(m.members?.full_name)} · ${esc(m.plan_code)} · ${fD(m.start_date)} · ${inr(m.final_price)}</option>`).join('')}</select></label><button class="btn">Create draft</button></form>
  <section class="card"><h2>Invoices</h2>${iv.length?iv.map(i=>`<div class="row"><span>${esc(i.number||'Draft')} · ${esc(i.members?.full_name)}<small>${inr(i.total)} · ${esc(i.status)}${i.status==='draft'?' · '+i.items.map(x=>esc(x.label)+' '+inr(x.amount)).join(', '):''}</small></span><span>${i.status==='draft'?`<button class="chip pv" data-id="${i.id}">Preview</button> <button class="chip is" data-id="${i.id}">Issue</button>`:i.status==='issued'?`<button class="chip pv" data-id="${i.id}">Print</button> <button class="chip dl" data-id="${i.id}">PDF</button> <button class="chip vd" data-id="${i.id}">Void</button>`:''}</span></div>`).join(''):'<div class="empty">No invoices yet</div>'}</section>`;
  $('#nf').onsubmit=e=>{e.preventDefault();guard(e.target.querySelector('.btn'),async()=>{ok(await sb.rpc('create_invoice',{p_membership:e.target.m.value}));toast('Draft created');ownerView('inv')})};
  document.querySelectorAll('.is').forEach(b=>b.onclick=()=>{if(confirm('Issue this invoice? Issued invoices cannot be edited.'))guard(b,async()=>{ok(await sb.rpc('issue_invoice',{p_id:b.dataset.id}));toast('Invoice issued');ownerView('inv')})});
  document.querySelectorAll('.vd').forEach(b=>b.onclick=()=>{if(confirm('Void this invoice?'))guard(b,async()=>{ok(await sb.rpc('void_invoice',{p_id:b.dataset.id}));ownerView('inv')})});
  document.querySelectorAll('.pv').forEach(b=>b.onclick=()=>{const i=iv.find(x=>x.id===b.dataset.id);printInv(i,i.members)});
  document.querySelectorAll('.dl').forEach(b=>b.onclick=()=>guard(b,()=>{const i=iv.find(x=>x.id===b.dataset.id);return pdf(i,i.members)}));
}};
</script></body></html>
